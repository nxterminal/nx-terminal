name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual escape hatch — re-run CI without pushing a new commit.
  workflow_dispatch:

# Cancel any in-flight run for the same branch/PR when a new commit
# lands. Keeps queue clean on rapid push and stops doubled spend on
# force-pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    # Cold install + DB bootstrap + ~670 tests run in ~2min today.
    # 15min gives a generous ceiling for slow caches or future test
    # growth without letting a hung run sit forever.
    timeout-minutes: 15

    services:
      # conftest._bootstrap_schema connects via raw psycopg2 and drops/
      # recreates the `nx` schema, then runs run_auto_migrations() to
      # build everything. We only need postgres up and accessible with
      # matching credentials — no manual schema/role setup beyond what
      # POSTGRES_USER/DB give us.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nxtest
          POSTGRES_PASSWORD: nxtest
          POSTGRES_DB: nxtest_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Mirrors backend/tests/conftest.py:_set_test_db_env() defaults.
      # conftest uses os.environ.setdefault, so explicit env here is the
      # source of truth if anyone overrides locally. Render's nx-db is
      # postgres 15 (render.yaml postgresMajorVersion: 15) — same major
      # here keeps CI honest.
      NX_DB_HOST: localhost
      NX_DB_PORT: "5432"
      NX_DB_NAME: nxtest_db
      NX_DB_USER: nxtest
      NX_DB_PASS: nxtest
      NX_DB_SCHEMA: nx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        # Pin to 3.11 to match runtime.txt (python-3.11.11). Patch-level
        # drift is fine; minor drift is not.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # pytest is a dev-only dep and not in backend/requirements.txt
        # (the prod runtime doesn't need it). Compatible-release pin
        # (`~=9.0`) accepts 9.x patch updates without touching the
        # workflow but blocks the 10.x major bump.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest~=9.0"

      - name: Run backend tests
        # --deselect carries one pre-existing tech-debt bug (issue #405):
        # the test asserts an int but the endpoint at admin.py:165 correctly
        # returns a string. Two sibling tests in test_fix_c_antiorphan.py
        # (lines 274, 310) already assert on strings. Once #405 is fixed,
        # remove this --deselect line and verify the test passes.
        run: |
          python -m pytest backend/tests/ -q \
            --deselect backend/tests/test_fund_dev_latency_fix.py::test_admin_summary_reports_stuck_pending_alert
